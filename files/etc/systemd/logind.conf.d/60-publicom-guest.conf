# Döda alla gästens processer när sessionen avslutas (utloggning, timeout, omstart av guest.service).
# guest.service använder PAMName=login, så sessionens processer ligger i en logind-session och inte
# i tjänstens cgroup. Utan detta kan X, Chromium m.m. från föregående session leva kvar.
[Login]
KillUserProcesses=yes
KillOnlyUsers=guest
