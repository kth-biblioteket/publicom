<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><title>Meddelande</title>
<link rel="stylesheet" href="ui.css">
<style>
body { background: transparent; }
#scrim[hidden] { display: none; }
#scrim { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
#card { box-sizing: border-box; background: #fff; display: flex; flex-direction: column; }
h1 { margin: 0; color: #000061; }
p { margin: 0; color: #3d4452; }
button { border: 0; }

/* Varning före tillbakagång ("Är du kvar?"): centrerat kort med nedräkning, knapparna under varandra */
#scrim.idle { background: rgba(0, 0, 40, .55); padding: 32px; }
#card.idle { width: 100%; max-width: 560px; border-radius: 24px; padding: 40px; align-items: center; text-align: center; gap: 18px; }
#card.idle h1 { font-size: 30px; line-height: 1.2; font-weight: 800; }
#card.idle p { font-size: 20px; line-height: 1.5; }
.count { position: relative; width: 120px; height: 120px; flex: none; }
.count svg { display: block; width: 120px; height: 120px; transform: rotate(-90deg); }
.count .track { fill: none; stroke: #def0ff; stroke-width: 10; }
.count .ring { fill: none; stroke: #004791; stroke-width: 10; stroke-linecap: round; stroke-dasharray: 327; transition: stroke-dashoffset 1s linear; }
.count .num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: 800; color: #000061; }
.idlebtns { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; margin-top: 6px; }
.idlebtns .cont { width: 100%; height: 72px; border-radius: 16px; background: #004791; color: #fff; font-size: 24px; font-weight: 700; }
.idlebtns .restart { height: 56px; padding: 0 24px; border-radius: 14px; background: transparent; color: #004791; font-size: 20px; font-weight: 700; }

/* Spärr-ark ("Sidan kan inte öppnas här"): ett ark längst ner med text och knapp till vänster och QR-kod till höger */
#scrim.blocked { background: rgba(0, 0, 40, .45); align-items: flex-end; }
#card.blocked { width: 100%; max-width: 760px; border-radius: 24px 24px 0 0; padding: 36px 40px 40px; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 32px; text-align: left; }
.blocked .left { flex: 1 1 300px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.blocked h1 { font-size: 30px; font-weight: 800; line-height: 1.2; }
.blocked p { font-size: 20px; line-height: 1.5; overflow-wrap: anywhere; }
.blocked .close { align-self: flex-start; height: 60px; padding: 0 28px; margin-top: 6px; border-radius: 14px; background: #004791; color: #fff; font-size: 20px; font-weight: 700; }
.blocked .qr { flex: none; padding: 14px; border: 1px solid #d6dce4; border-radius: 16px; background: #fff; }
.blocked .qr svg { display: block; width: 210px; height: 210px; }

/* Felsida ("Sidan kunde inte laddas"): en hel vit sida ovanför navigeringsfältet */
#scrim.error { background: #fff; padding: 48px; }
#card.error { width: 100%; max-width: 560px; background: transparent; align-items: center; text-align: center; gap: 18px; }
.error h1 { font-size: 34px; font-weight: 800; line-height: 1.2; }
.error p { font-size: 20px; line-height: 1.5; }
.error .icon { width: 72px; height: 72px; flex: none; }
.errbtns { display: flex; gap: 14px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }
.errbtns button { height: 60px; padding: 0 28px; border-radius: 14px; font-size: 20px; font-weight: 700; }
.errbtns .retry { background: #fff; color: #004791; border: 2px solid #004791; }
.errbtns .home { background: #004791; color: #fff; }
</style></head>
<body><div id="scrim" hidden><div id="card"></div></div>
<script src="qrcode.js"></script>
<script src="icons.js"></script>
<script>
const $ = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
function button(label, cls, act) {
  const b = $('button', 'press ' + cls, label);
  b.type = 'button'; b.onclick = () => kiosk.act(act);
  return b;
}
const RING = 327; // omkretsen 2π·52

/** Varningen byggs en gång och uppdateras sedan på plats varje sekund, så att ringen töms mjukt */
function renderIdle(o, t, card) {
  if (card.dataset.kind !== 'idle') {
    card.dataset.kind = 'idle';
    card.className = 'idle';
    card.innerHTML = '';
    const count = $('div', 'count');
    count.innerHTML = '<svg viewBox="0 0 120 120" aria-hidden="true"><circle class="track" cx="60" cy="60" r="52"/><circle class="ring" cx="60" cy="60" r="52"/></svg>';
    count.appendChild($('div', 'num'));
    const btns = $('div', 'idlebtns');
    const cont = button('', 'cont', 'idleContinue'); cont.id = 'idle-continue';
    const restart = button('', 'restart', 'home'); restart.id = 'idle-restart';
    btns.append(cont, restart);
    card.append(count, $('h1', ''), $('p', ''), btns);
  }
  const total = Math.max(1, o.total || o.secondsLeft || 1);
  const left = Math.max(0, Math.min(total, o.secondsLeft));
  card.querySelector('.ring').style.strokeDashoffset = String(RING * (1 - left / total));
  card.querySelector('.num').textContent = left;
  card.querySelector('h1').textContent = t.idleTitle;
  card.querySelector('p').textContent = t.idleText;
  document.getElementById('idle-continue').textContent = t.idleContinue;
  document.getElementById('idle-restart').textContent = t.idleRestart;
}

function renderBlocked(o, t, card) {
  card.dataset.kind = 'blocked';
  card.className = 'blocked';
  card.innerHTML = '';
  const left = $('div', 'left');
  left.append($('h1', '', t.blockedTitle), $('p', '', o.qr && o.host ? t.blockedHost.replace('{host}', o.host) : t.blockedText), button(t.close, 'close', 'overlayClose'));
  card.append(left);
  if (o.qr) {
    const q = qrcode(0, 'M'); q.addData(o.url); q.make();
    const box = $('div', 'qr');
    box.innerHTML = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }).replace(/fill="black"/g, 'fill="#000061"');
    card.append(box);
  }
}

function renderError(o, t, s, card) {
  card.dataset.kind = 'error';
  card.className = 'error';
  card.innerHTML = '';
  const icon = $('div', 'icon');
  icon.innerHTML = '<svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#004791" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    (ICONS['wifi-off'] || []).map((d) => '<path d="' + d + '"/>').join('') + '</svg>';
  const btns = $('div', 'errbtns');
  if (!o.offline) btns.append(button(t.retry, 'retry', 'retry'));
  btns.append(button(s.startLabel || t.start, 'home', 'home'));
  card.append(icon, $('h1', '', o.offline ? t.offlineTitle : t.errorTitle), $('p', '', o.offline ? t.offlineText : t.errorText), btns);
}

function render(s) {
  const scrim = document.getElementById('scrim');
  const o = s.overlay;
  scrim.hidden = !o;
  if (!o) return;
  const t = s.strings, card = document.getElementById('card');
  scrim.className = o.type;
  if (o.type === 'idle') renderIdle(o, t, card);
  else if (o.type === 'blocked') renderBlocked(o, t, card);
  else if (o.type === 'error') renderError(o, t, s, card);
}
kiosk.state().then(render);
kiosk.onState(render);
</script></body></html>
