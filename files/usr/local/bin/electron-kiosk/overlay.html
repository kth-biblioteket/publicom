<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><title>Meddelande</title>
<link rel="stylesheet" href="ui.css">
<style>
body { background: transparent; }
#scrim[hidden] { display: none; }
#scrim { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
#card { box-sizing: border-box; background: #fff; display: flex; flex-direction: column; }
h1, p, .t2 { margin: 0; }
button { border: 0; }
/* Tvåspråkig text: svenska i full storlek, engelska mindre och ljusare direkt under (samma mått som PubLiKiosk) */
.head .sv { color: #1f2937; font-weight: 800; line-height: 1.15; }
.head .en { color: #7b8494; font-weight: 600; margin-top: 2px; line-height: 1.2; }
.body .sv { color: #3d4452; font-size: 20px; line-height: 1.5; }
.body .en { color: #7b8494; font-size: 16px; line-height: 1.45; margin-top: 8px; }
.bbtn { display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; text-align: center; box-sizing: border-box; border-radius: 14px; }
.bbtn .sv { font-weight: 700; }
.bbtn .en { font-weight: 400; margin-top: 3px; }
.bbtn.blue { background: #004791; color: #fff; }
.bbtn.blue .en { color: rgba(255, 255, 255, .78); }
.bbtn.white { background: #fff; color: #1f2937; border: 2px solid #dde2e9; }
.bbtn.white .en { color: #6b7280; }
.bbtn.plain { background: transparent; color: #004791; border: 0; } /* utan ram och bakgrund (Börja om nu) */
.bbtn.plain .en { color: #6b7280; }

/* Varning före tillbakagång ("Är du kvar?"): centrerat kort med nedräkning, knapparna under varandra */
#scrim.idle { background: rgba(0, 0, 40, .55); padding: 32px; }
#card.idle { width: 100%; max-width: 560px; border-radius: 24px; padding: 40px; align-items: center; text-align: center; }
#card.idle .head .sv { font-size: 30px; }
#card.idle .head .en { font-size: 20px; }
.count { position: relative; width: 120px; height: 120px; flex: none; }
.count svg { display: block; width: 120px; height: 120px; transform: rotate(-90deg); }
.count .track { fill: none; stroke: #dde2e9; stroke-width: 10; }
.count .ring { fill: none; stroke: #004791; stroke-width: 10; stroke-linecap: round; stroke-dasharray: 327; transition: stroke-dashoffset 1s linear; }
.count .num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: 800; color: #004791; }
#card.idle .head { margin-top: 18px; }
#card.idle .body { margin-top: 18px; }
.idlebtns { display: flex; flex-direction: column; width: 100%; margin-top: 28px; gap: 12px; }
.idlebtns .cont { width: 100%; height: 72px; }
.idlebtns .cont .sv { font-size: 24px; }
.idlebtns .cont .en { font-size: 15px; }
.idlebtns .restart { height: 56px; padding: 0 24px; align-self: center; width: auto; margin-top: 2px; }
.idlebtns .restart .sv { font-size: 20px; }
.idlebtns .restart .en { font-size: 13px; }

/* Spärr-ark ("Sidan kan inte öppnas här"): ett ark längst ner med text och knapp till vänster och QR-kod till höger */
#scrim.blocked { background: rgba(0, 0, 40, .45); align-items: flex-end; }
#card.blocked { width: 100%; max-width: 760px; border-radius: 24px 24px 0 0; padding: 36px 40px 40px; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 32px; text-align: left; }
.blocked .left { flex: 1 1 300px; display: flex; flex-direction: column; min-width: 0; }
.blocked .head .sv { font-size: 30px; }
.blocked .head .en { font-size: 20px; }
.blocked .body { margin-top: 14px; overflow-wrap: anywhere; }
.blocked .close { align-self: flex-start; height: 60px; padding: 0 40px; margin-top: 20px; }
.blocked .close .sv { font-size: 20px; }
.blocked .close .en { font-size: 14px; }
.blocked .qr { flex: none; padding: 14px; border: 1px solid #d6dce4; border-radius: 16px; background: #fff; }
.blocked .qr svg { display: block; width: 210px; height: 210px; }

/* Felsida ("Sidan kunde inte laddas"): en hel vit sida ovanför navigeringsfältet */
#scrim.error { background: #fff; padding: 48px; }
#card.error { width: 100%; max-width: 560px; background: transparent; align-items: center; text-align: center; }
.error .head { margin-top: 18px; }
.error .head .sv { font-size: 34px; }
.error .head .en { font-size: 22px; }
.error .body { margin-top: 18px; }
.error .icon { width: 72px; height: 72px; flex: none; }
.errbtns { display: flex; gap: 14px; margin-top: 26px; flex-wrap: wrap; justify-content: center; }
.errbtns .bbtn { height: 60px; padding: 0 28px; white-space: nowrap; }
.errbtns .bbtn .sv { font-size: 20px; }
.errbtns .bbtn .en { font-size: 14px; }
</style></head>
<body><div id="scrim" hidden><div id="card"></div></div>
<script src="qrcode.js"></script>
<script src="icons.js"></script>
<script>
const $ = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
const RING = 327; // omkretsen 2π·52

/** Svenska och engelska i samma ruta; engelskan utelämnas när den saknas eller är lika med svenskan. cls: head (rubrik) eller body (brödtext) */
function two(cls, sv, en) {
  const box = $('div', cls);
  box.append($('div', 'sv', sv));
  if (en && en.trim() && en.trim().toLowerCase() !== sv.trim().toLowerCase()) box.append($('div', 'en', en.trim()));
  return box;
}
function setTwo(box, sv, en) { const n = two('', sv, en); box.replaceChildren(...n.childNodes); }

/** Knapp med två textrader */
function bbtn(color, cls, act, sv, en) {
  const b = $('button', 'press bbtn ' + color + ' ' + cls);
  b.type = 'button'; b.onclick = () => kiosk.act(act);
  setTwo(b, sv, en);
  return b;
}

/** Varningen byggs en gång och uppdateras sedan på plats varje sekund, så att ringen töms mjukt */
function renderIdle(o, t, card) {
  if (card.dataset.kind !== 'idle') {
    card.dataset.kind = 'idle';
    card.className = 'idle';
    card.innerHTML = '';
    const count = $('div', 'count');
    count.innerHTML = '<svg viewBox="0 0 120 120" aria-hidden="true"><circle class="track" cx="60" cy="60" r="52"/><circle class="ring" cx="60" cy="60" r="52"/></svg>';
    count.appendChild($('div', 'num'));
    const btns = $('div', 'idlebtns');
    btns.append(bbtn('blue', 'cont', 'idleContinue', '', ''), bbtn('plain', 'restart', 'home', '', ''));
    card.append(count, $('div', 'head'), $('div', 'body'), btns);
  }
  const total = Math.max(1, o.total || o.secondsLeft || 1);
  const left = Math.max(0, Math.min(total, o.secondsLeft));
  card.querySelector('.ring').style.strokeDashoffset = String(RING * (1 - left / total));
  card.querySelector('.num').textContent = left;
  setTwo(card.querySelector('.head'), t.sv.idleTitle, t.en.idleTitle);
  setTwo(card.querySelector('.body'), t.sv.idleText, t.en.idleText);
  setTwo(card.querySelector('.cont'), t.sv.idleContinue, t.en.idleContinue);
  setTwo(card.querySelector('.restart'), t.sv.idleRestart, t.en.idleRestart);
}

function renderBlocked(o, t, card) {
  card.dataset.kind = 'blocked';
  card.className = 'blocked';
  card.innerHTML = '';
  const left = $('div', 'left');
  const body = o.qr && o.host
    ? [t.sv.blockedHost.replace('{host}', o.host), t.en.blockedHost.replace('{host}', o.host)]
    : [t.sv.blockedText, t.en.blockedText];
  left.append(two('head', t.sv.blockedTitle, t.en.blockedTitle), two('body', body[0], body[1]), bbtn('blue', 'close', 'overlayClose', t.sv.close, t.en.close));
  card.append(left);
  if (o.qr) {
    const q = qrcode(0, 'M'); q.addData(o.url); q.make();
    const box = $('div', 'qr');
    box.innerHTML = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }).replace(/fill="black"/g, 'fill="#000061"');
    card.append(box);
  }
}

function renderError(o, t, s, card) {
  card.dataset.kind = 'error';
  card.className = 'error';
  card.innerHTML = '';
  const icon = $('div', 'icon');
  icon.innerHTML = '<svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#004791" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    (ICONS['wifi-off'] || []).map((d) => '<path d="' + d + '"/>').join('') + '</svg>';
  const btns = $('div', 'errbtns');
  if (!o.offline) btns.append(bbtn('white', 'retry', 'retry', t.sv.retry, t.en.retry));
  btns.append(bbtn('blue', 'home', 'home', s.startBi.sv, s.startBi.en));
  card.append(icon,
    two('head', o.offline ? t.sv.offlineTitle : t.sv.errorTitle, o.offline ? t.en.offlineTitle : t.en.errorTitle),
    two('body', o.offline ? t.sv.offlineText : t.sv.errorText, o.offline ? t.en.offlineText : t.en.errorText),
    btns);
}

function render(s) {
  const scrim = document.getElementById('scrim');
  const o = s.overlay;
  scrim.hidden = !o;
  if (!o) return;
  const t = s.bi, card = document.getElementById('card');
  scrim.className = o.type;
  if (o.type === 'idle') renderIdle(o, t, card);
  else if (o.type === 'blocked') renderBlocked(o, t, card);
  else if (o.type === 'error') renderError(o, t, s, card);
}
kiosk.state().then(render);
kiosk.onState(render);
</script></body></html>
